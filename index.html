<header><div class="logo" onclick="home()"><img src="taverntales-icon-192.png" alt=""><span class="logoName">Tavern<span>Tales</span></span></div><div class="search"><input id="search" placeholder="Search podcasts, blogs and posts…" oninput="render()"></div><div class="headBtns"><button id="settingsBtn" class="btn" onclick="settings()">⚙️ Settings</button><button id="notifyBtn" class="btn hide" onclick="notifications()">🔔 <span id="notifyCount"></span></button><button id="postBtn" class="btn primary hide" onclick="editor()">＋ Post</button><button id="account" class="btn" onclick="auth()">Sign in</button></div></header>
<main id="app"></main><div id="modal"></div><div id="dialogRoot" class="dialogRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const TYPES={podcast:'🎙️ Podcast',blog:'📝 Blog',announcement:'📢 Announcement',image:'🖼️ Image'};
const DEFAULT_SUPABASE_URL='https://psygguwemigzfzrrjztz.supabase.co';
const DEFAULT_SUPABASE_KEY='sb_publishable_tl96bEAoxZM_gZ41GEe-Kg_YjJJrecD';
let supa=null,user=null,posts=[],filter='all',editId=null,currentPostId=null,replyTo=null,pageView='home',profileReturnPost='';

// Configure fresh browsers with this project's public client credentials once.
if(localStorage.getItem('podly_config_revision')!=='supabase-project-1'){
 localStorage.setItem('podly_url',DEFAULT_SUPABASE_URL);
 localStorage.setItem('podly_key',DEFAULT_SUPABASE_KEY);
 localStorage.setItem('podly_config_revision','supabase-project-1');
}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function date(s){return new Date(s||Date.now()).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function icon(t){return ({podcast:'🎙️',blog:'📝',announcement:'📢',image:'🖼️'})[t]||'✦'}
function local(){try{return JSON.parse(localStorage.getItem('podly_posts')||'[]')}catch{return[]}}
function saveLocal(){localStorage.setItem('podly_posts',JSON.stringify(posts))}
function hiddenEmail(name){return name.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@taverntales.app'}
function usernameOf(){return user?.user_metadata?.username||localStorage.getItem('podly_username')||''}
function isOwner(){const owner=localStorage.getItem('podly_owner_username')||'AlbozoB3an';return !!user&&usernameOf().toLowerCase()===owner.toLowerCase()}
const OFFICIAL_USERS=['raven','orizon','glenn the brave'];
function isOfficialUsername(name){return OFFICIAL_USERS.includes(String(name||'').trim().toLowerCase())}
function isOwnerUsername(name){const owner=localStorage.getItem('podly_owner_username')||'AlbozoB3an';return String(name||'').trim().toLowerCase()===owner.toLowerCase()}
function isOfficial(){return !!user&&isOfficialUsername(usernameOf())}
function canPublish(){return isOwner()||isOfficial()}
function authorLabel(p){return String(p?.author_username||p?.username||'AlbozoB3an')}
function badgeMarkup(name){return isOwnerUsername(name)?' <span class="ownerBadge">★ Owner</span>':isOfficialUsername(name)?' <span class="officialBadge">✓ Official</span>':''}
function authorMarkup(p){const name=authorLabel(p);return `<button type="button" class="authorLink" data-creator="${esc(name)}" onclick="event.stopPropagation();openCreator(this.dataset.creator)">${esc(name)}${badgeMarkup(name)}</button>`}
function profileDataFor(name){const key='podly_profile_'+String(name||'').toLowerCase();try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return{}}}
function profileData(){return profileDataFor(usernameOf())}
function saveProfileData(d){localStorage.setItem('podly_profile_'+usernameOf().toLowerCase(),JSON.stringify(d))}
function projectSlug(url){try{return new URL(url).hostname.split('.')[0].toLowerCase().replace(/[^a-z0-9_-]/g,'')||'project'}catch{return'project'}}
function accountStorageKey(url,name){const account=String(name||'default').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'')||'default';return `podly-${projectSlug(url)}-${account}-auth-token`}
function accountsListKey(url=localStorage.getItem('podly_url')||''){return `podly_accounts_${projectSlug(url)}`}
function activeAccountKey(url=localStorage.getItem('podly_url')||''){return `podly_active_account_${projectSlug(url)}`}
function savedAccounts(url=localStorage.getItem('podly_url')||''){try{const names=JSON.parse(localStorage.getItem(accountsListKey(url))||'[]');return Array.isArray(names)?names:[]}catch{return[]}}
function rememberAccount(name,url=localStorage.getItem('podly_url')||''){
 const clean=String(name||'').trim();if(!clean)return;
 const names=savedAccounts(url).filter(x=>String(x).toLowerCase()!==clean.toLowerCase());names.push(clean);
 localStorage.setItem(accountsListKey(url),JSON.stringify(names));localStorage.setItem(activeAccountKey(url),clean);localStorage.setItem('podly_active_username',clean);localStorage.setItem('podly_username',clean);
}
function forgetAccount(name,url=localStorage.getItem('podly_url')||''){
 const names=savedAccounts(url).filter(x=>String(x).toLowerCase()!==String(name).toLowerCase());
 localStorage.setItem(accountsListKey(url),JSON.stringify(names));if(localStorage.getItem(activeAccountKey(url))?.toLowerCase()===String(name).toLowerCase())localStorage.removeItem(activeAccountKey(url));if(localStorage.getItem('podly_active_username')?.toLowerCase()===String(name).toLowerCase())localStorage.removeItem('podly_active_username');
}
function createAccountClient(url,key,name){return window.supabase.createClient(url,key,{auth:{storageKey:accountStorageKey(url,name)}})}
function watchAccountClient(client,name,url){
 if(client.__ttAccountWatch)return;
 client.__ttAccountWatch=true;
 client.auth.onAuthStateChange((_event,session)=>{if(supa!==client)return;user=session?.user||null;if(user)rememberAccount(user.user_metadata?.username||name,url);account();render();if(user)refreshNotificationCount()});
}


const MEDIA_BUCKET='podly-media';
const POST_KEY_FIELDS=['id','post_id','uuid','postid','postId','key','title'];

function postRef(p){
  for(const field of POST_KEY_FIELDS){
    if(p && p[field]!==undefined && p[field]!==null && String(p[field]).trim()!=='') return {field,value:p[field]};
  }
  return null;
}
function postClientKey(p){return p.__ttKey||(p.__ttKey=crypto.randomUUID())}
function findPost(ref){
  if(!ref)return null;
  const s=decodeURIComponent(String(ref));
  return posts.find(p=>String(postClientKey(p))===s)||posts.find(p=>{const r=postRef(p);return r&&String(r.value)===s})||null;
}
function normalizePosts(rows){
  posts=(rows||[]).map(p=>({...p,__ttKey:crypto.randomUUID()}));
  return posts;
}
function mediaMime(url){
  if(!url)return '';
  try{
    const clean=String(url).split('?')[0].split('#')[0];
    const ext=(clean.split('.').pop()||'').toLowerCase();
    return ({mp4:'video/mp4',webm:'video/webm',ogv:'video/ogg',ogg:'video/ogg',mov:'video/quicktime',m4v:'video/mp4',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',opus:'audio/ogg'}[ext]||'');
  }catch{return ''}
}
function storagePathFromUrl(url){
  if(!url)return null;
  try{
    const u=new URL(url);
    const m=u.pathname.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^/]+)\/(.+)$/);
    if(!m)return null;
    return {bucket:decodeURIComponent(m[1]),path:decodeURIComponent(m[2].split('?')[0])};
  }catch{
    const raw=String(url).trim().replace(/^\/+/, '');
    if(!raw||/^(data:|blob:)/i.test(raw))return null;
    const prefix=MEDIA_BUCKET+'/';
    const path=raw.startsWith(prefix)?raw.slice(prefix.length):raw;
    if(!path||/^[a-z][a-z0-9+.-]*:/i.test(path))return null;
    try{return {bucket:MEDIA_BUCKET,path:decodeURIComponent(path.split('?')[0])}}catch{return {bucket:MEDIA_BUCKET,path:path.split('?')[0]}}
  }
}
function mediaTypeForFile(file){
 if(file?.type)return file.type;
 const ext=fileExtension(file);
 return ({mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',ogv:'video/ogg',mov:'video/quicktime',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',opus:'audio/ogg',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif'})[ext]||'';
}
async function mediaLoadFailed(el,kind){
 if(!el||el.dataset.retrying||el.dataset.loadFailed)return;
 const p=findPost(el.dataset.post||'');
 if(p&&!el.dataset.retried){
  el.dataset.retried='1';el.dataset.retrying='true';
  const field=kind==='video'?'video_url':'thumbnail_url',cache=kind==='video'?'__videoUrl':'__thumbUrl';
  p[cache]='';
  const refreshed=await resolveMediaUrl(p[field]);
  p[cache]=refreshed||p[field]||'';
  const source=kind==='video'?el.querySelector('source'):null;
  const oldSrc=kind==='video'?(source?.src||''):el.src;
  if(p[cache]&&p[cache]!==oldSrc){
   if(kind==='video'&&source){source.src=p[cache];const mime=mediaMime(p[cache]);if(mime)source.type=mime;el.load()}
   else if(kind==='thumbnail')el.src=p[cache];
   el.dataset.retrying='';return;
  }
  el.dataset.retrying='';
 }
 el.dataset.loadFailed='true';el.style.display='none';
 const note=document.createElement('div');note.className='mediaError';
 note.textContent=kind==='video'?'Video could not load after refreshing its link. Check the Supabase podly-media bucket permissions and use an MP4 (H.264) or WebM video.':'Thumbnail could not load after refreshing its link. Check the Supabase podly-media bucket permissions and the saved image URL.';
 el.insertAdjacentElement('afterend',note);
}
async function removeStoredMedia(url){
 const info=storagePathFromUrl(url);
 if(!supa||!info)return;
 const r=await supa.storage.from(info.bucket).remove([info.path]);
 if(r.error)throw r.error;
}
async function resolveMediaUrl(url){
  if(!url||!supa)return url||'';
  const info=storagePathFromUrl(url);
  if(!info)return url;
  try{
    const signed=await supa.storage.from(info.bucket).createSignedUrl(info.path,3600);
    if(!signed.error&&signed.data?.signedUrl)return signed.data.signedUrl;
  }catch{}
  try{
    return supa.storage.from(info.bucket).getPublicUrl(info.path).data.publicUrl||url;
  }catch{return url}
}
async function preparePostMedia(p){
  if(!p)return;
  const [thumb,video,audio]=await Promise.all([resolveMediaUrl(p.thumbnail_url),resolveMediaUrl(p.video_url),resolveMediaUrl(p.audio_url)]);
  p.__thumbUrl=thumb||p.thumbnail_url||'';
  p.__videoUrl=video||p.video_url||'';
  p.__audioUrl=audio||p.audio_url||'';
}
async function prepareAllPostMedia(){await Promise.all(posts.map(preparePostMedia))}
function mediaErrorLabel(kind){return kind==='video'?'This video could not be loaded. Check the Supabase Storage bucket and uploaded file format.':'This media could not be loaded.'}
function mediaUrl(p,kind){return kind==='thumb'?(p.__thumbUrl||p.thumbnail_url||''):kind==='video'?(p.__videoUrl||p.video_url||''):(p.__audioUrl||p.audio_url||'')}
function postDbFilter(query,p){
  const ref=postRef(p);
  if(ref)return query.eq(ref.field,ref.value);
  if(p?.title)query=query.eq('title',p.title);
  if(p?.created_at!==undefined){
    query=p.created_at===null?query.is('created_at',null):p.created_at?query.eq('created_at',p.created_at):query;
  }
  if(p?.content!==undefined)query=query.eq('content',p.content);
  return query;
}
async function ensureSingleDbPostMatch(operation,p,data){
  if(!postRef(p)&&!p?.title)throw new Error('This post has no ID or title to identify it in the database.');
  const check=await postDbFilter(supa.from('posts').select('*'),p).limit(2);
  if(check.error)throw check.error;
  if(!check.data?.length)throw new Error('The post was not found in the database. Refresh the page and try again.');
  if(check.data.length!==1)throw new Error('This post matches multiple database rows. Add a unique ID column to the posts table before editing or deleting it.');
  const mutation=operation==='update'?supa.from('posts').update(data).select('*'):supa.from('posts').delete().select('*');
  return postDbFilter(mutation,p);
}

function appDialog(message,{confirm=false,title='TavernTales',okText='OK'}={}){
 return new Promise(resolve=>{
  const root=document.getElementById('dialogRoot');root.replaceChildren();
  const bg=document.createElement('div');bg.className='modalBg';
  const box=document.createElement('div');box.className='modal small';
  const head=document.createElement('div');head.className='modalHead';
  const heading=document.createElement('h2');heading.textContent=title;
  head.appendChild(heading);box.appendChild(head);
  const text=document.createElement('p');text.style.cssText='white-space:pre-wrap;line-height:1.55;color:var(--muted);margin:0';text.textContent=String(message||'');box.appendChild(text);
  const actions=document.createElement('div');actions.className='actions';
  const finish=value=>{document.removeEventListener('keydown',onKey);root.replaceChildren();resolve(value)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();finish(false)}else if(e.key==='Enter'&&confirm){e.preventDefault();e.stopImmediatePropagation();finish(true)}};
  if(confirm){const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='Cancel';cancel.onclick=()=>finish(false);actions.appendChild(cancel)}
  const ok=document.createElement('button');ok.className='btn primary';ok.textContent=confirm?okText:okText;ok.onclick=()=>finish(true);actions.appendChild(ok);box.appendChild(actions);
  bg.addEventListener('click',e=>{if(e.target===bg)finish(false)});bg.appendChild(box);root.appendChild(bg);document.addEventListener('keydown',onKey);
  (confirm?actions.firstChild:ok).focus();
 });
}

function fileExtension(file){return (file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin'}
async function uploadFile(file,folder){
 if(!supa)throw new Error('Connect Supabase first in Settings.');
 const ext=fileExtension(file),path=`${folder}/${crypto.randomUUID()}.${ext}`;
 const contentType=mediaTypeForFile(file);
 if(!contentType)throw new Error(`Could not determine the file type for ${file.name}. Try a standard image, MP4/WebM video, or audio file.`);
 const up=await supa.storage.from(MEDIA_BUCKET).upload(path,file,{upsert:false,contentType,cacheControl:'3600'});
 if(up.error)throw up.error;
 const publicUrl=supa.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
 return {url:publicUrl,path,mime:contentType};
}

async function publish(){

  const thumbFile=document.getElementById('thumbFile')?.files?.[0],mediaFile=document.getElementById('mediaFile')?.files?.[0];

  if(thumbFile){const m=await uploadFile(thumbFile,'thumbnails');thumbUrl=m.url}
  if(mediaFile){
   const oldVideo=document.getElementById('video')?.value.trim()||'',oldAudio=document.getElementById('audio')?.value.trim()||'';
   const m=await uploadFile(mediaFile,'media');
   if(mediaFile.type.startsWith('video/')){videoUrl=m.url;audioUrl=''}
   else if(mediaFile.type.startsWith('audio/')){audioUrl=m.url;videoUrl=''}
   else throw new Error('The selected media file is not a supported video or audio file.');
   if(oldVideo&&oldVideo!==videoUrl)try{await removeStoredMedia(oldVideo)}catch(e){console.warn('Could not remove replaced video from storage:',e)}
   if(oldAudio&&oldAudio!==audioUrl)try{await removeStoredMedia(oldAudio)}catch(e){console.warn('Could not remove replaced audio from storage:',e)}
  }
  if(!mediaFile){
   const p=editId?findPost(editId):null;
   const removed=[];
   if(p?.video_url&&!videoUrl)removed.push(p.video_url);
   if(p?.audio_url&&!audioUrl)removed.push(p.audio_url);
   for(const oldUrl of removed)try{await removeStoredMedia(oldUrl)}catch(e){console.warn('Could not remove media from storage:',e)}
  }
  const original=editId?findPost(editId):null;
  const d={title:document.getElementById('ttl').value.trim(),type:document.getElementById('pt').value,description:document.getElementById('desc').value.trim(),content:document.getElementById('content').value,thumbnail_url:thumbUrl,audio_url:audioUrl,video_url:videoUrl,author_username:original?.author_username||usernameOf()};
  if(!d.title)return appAlert('Add a title first.');
  if(supa){
   if(editId){
    const p=findPost(editId);if(!p)throw new Error('Post not found.');
    const q=await ensureSingleDbPostMatch('update',p,d);
    const r=await q;
    if(r.error)throw r.error;
    if(r.data?.length!==1)throw new Error('The post could not be updated. Check Supabase permissions and try again.');
    
   }else{
    const r=await supa.from('posts').insert(d).select('*');
    if(r.error)throw r.error;
   }
   await load();
  }else{
   if(editId){const p=findPost(editId),i=posts.indexOf(p);if(i>=0)posts[i]={...posts[i],...d};}
   else posts.unshift({id:crypto.randomUUID(),...d,created_at:new Date().toISOString(),__ttKey:crypto.randomUUID()});
   saveLocal();await prepareAllPostMedia();
  }
  if(editedPost?.thumbnail_url&&editedPost.thumbnail_url!==thumbUrl)try{await removeStoredMedia(editedPost.thumbnail_url)}catch(e){console.warn('Could not remove replaced thumbnail from storage:',e)}
  editId=null;closeModal();render()
 }catch(e){console.error(e);appAlert(e.message||'Upload failed.','Upload failed')}
}

async function del(id){
 const p=findPost(id)||findPost(currentPostId);if(!p||!isOwner())return;if(!await appConfirm('Do you want to delete this post? This cannot be undone.','Delete post'))return;
 try{
  if(supa){
   const q=await ensureSingleDbPostMatch('delete',p);
   const r=await q;
   if(r.error)throw r.error;
   if(!r.data?.length)throw new Error('The post was not deleted. Check that you are signed in as the owner and that Supabase allows this account to delete posts.');
   
  }
  for(const url of [p.thumbnail_url,p.video_url,p.audio_url].filter(Boolean))try{await removeStoredMedia(url)}catch(e){console.warn('Post deleted, but a media file could not be removed from storage:',e)}
  posts=posts.filter(x=>postClientKey(x)!==postClientKey(p));
  saveLocal();currentPostId=null;editId=null;render()
 }catch(e){console.error(e);appAlert(e.message||'Delete failed.','Delete failed')}
}

async function react(postId,type){
 const p=findPost(postId)||findPost(currentPostId);if(!p)return;if(!user)return auth();
 const ref=postRef(p);
 if(supa&&ref){
  const e=await supa.from('post_reactions').select('reaction').eq('post_id',ref.value).eq('user_id',user.id).maybeSingle();if(e.error)return appAlert(e.error.message,'Reaction failed');
  if(e.data?.reaction===type){const r=await supa.from('post_reactions').delete().eq('post_id',ref.value).eq('user_id',user.id);if(r.error)return appAlert(r.error.message,'Reaction failed')}
  else{const r=await supa.from('post_reactions').upsert({post_id:ref.value,user_id:user.id,reaction:type},{onConflict:'post_id,user_id'});if(r.error)return appAlert(r.error.message,'Reaction failed')}
 }else if(!supa){const r=JSON.parse(localStorage.getItem('podly_reactions')||'{}'),k=postClientKey(p)+'|'+user.id;if(r[k]===type)delete r[k];else r[k]=type;localStorage.setItem('podly_reactions',JSON.stringify(r))}
 openPost(postClientKey(p))
}

async function addComment(postId){
 const p=findPost(postId)||findPost(currentPostId);if(!p)return;if(!user)return auth();const text=document.getElementById('commentText')?.value.trim();if(!text)return;
 const ref=postRef(p);if(!ref&&supa)return appAlert('This post has no recognized database key.','Comment unavailable');
 if(supa){const r=await supa.from('comments').insert({post_id:ref.value,user_id:user.id,username:usernameOf(),content:text,parent_id:replyTo||null});if(r.error)return appAlert(r.error.message,'Comment failed')}
 else{const k='podly_comments_'+postClientKey(p),a=JSON.parse(localStorage.getItem(k)||'[]');a.push({id:crypto.randomUUID(),user_id:user.id,username:usernameOf(),content:text,parent_id:replyTo||null,pinned:false,created_at:new Date().toISOString()});localStorage.setItem(k,JSON.stringify(a))}
 replyTo=null;openPost(postClientKey(p))
}

async function deleteComment(id){
 id=decodeURIComponent(id);if(!user||!await appConfirm('Do you want to delete this comment? This cannot be undone.','Delete comment'))return;
 if(supa){const r=await supa.from('comments').delete().eq('id',id).eq('user_id',user.id);if(r.error)return appAlert(r.error.message,'Delete failed')}
 else{const k='podly_comments_'+currentPostId,a=JSON.parse(localStorage.getItem(k)||'[]');localStorage.setItem(k,JSON.stringify(a.filter(c=>String(c.id)!==String(id))))}
 openPost(currentPostId)
}

async function togglePin(id,pin){
 id=decodeURIComponent(id);if(!isOwner())return;
 if(supa){const r=await supa.from('comments').update({pinned:pin}).eq('id',id);if(r.error)return appAlert(r.error.message,'Comment update failed')}
 else{const k='podly_comments_'+currentPostId,a=JSON.parse(localStorage.getItem(k)||'[]'),i=a.findIndex(c=>String(c.id)===String(id));if(i>=0)a[i].pinned=pin;localStorage.setItem(k,JSON.stringify(a))}
 openPost(currentPostId)
}

async function refreshNotificationCount(){
 if(!user||!supa)return;const r=await supa.from('notifications').select('id').eq('user_id',user.id).eq('read',false);const n=document.getElementById('notifyCount');if(n)n.textContent=r.error?'':(r.data?.length||0)
}
async function notifications(){
 if(!user)return auth();let list=[];
 if(supa){const r=await supa.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(!r.error)list=r.data||[]}
 modal(`<div class="modal small"><div class="modalHead"><h2>🔔 Notifications</h2><button class="close" onclick="closeModal()">×</button></div>${list.length?list.map(n=>`<div class="notification ${n.read?'':'unread'}" onclick="notificationOpen('${esc(n.post_id||'')}')"><div>${esc(n.message||'You have a new notification.')}</div><small>${date(n.created_at)}</small></div>`).join(''):`<div class="empty" style="padding:30px">No notifications yet.</div>`}<div class="actions"><button class="btn" onclick="markNotificationsRead()">Mark all as read</button></div></div>`)
}
async function notificationOpen(id){if(supa&&user)await supa.from('notifications').update({read:true}).eq('user_id',user.id);closeModal();if(id)openPost(encodeURIComponent(String(id)));refreshNotificationCount()}
async function markNotificationsRead(){if(supa&&user)await supa.from('notifications').update({read:true}).eq('user_id',user.id);refreshNotificationCount();notifications()}

async function enableNotifications(){
 if(!('Notification' in window))return appAlert('This browser does not support notifications.');
 const p=await Notification.requestPermission();if(p==='granted'){await appAlert('Browser notifications enabled!');render()}else await appAlert('Notification permission was not granted.','Permission not granted')
}

function auth(mode='login',suggested=''){
 modal(`<div class="modal small"><div class="modalHead"><h2>${mode==='login'?'Sign in to TavernTales':'Create a TavernTales account'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="authTabs"><button class="${mode==='login'?'active':''}" onclick="auth('login')">Sign in</button><button class="${mode==='signup'?'active':''}" onclick="auth('signup')">Create account</button></div><div class="field"><label>Username</label><input id="username" value="${esc(suggested)}" autocomplete="username"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><div id="msg" class="msg"></div><button class="btn primary" style="width:100%" onclick="${mode==='login'?'login()':'signup()'}">${mode==='login'?'Sign in':'Create account'}</button></div>`)
}
async function login(){
 const name=username.value.trim(),password=pw.value,url=localStorage.getItem('podly_url'),key=localStorage.getItem('podly_key');
 if(!name||!password)return msg.innerHTML='<span class="err">Enter your username and password.</span>';
 if(!url||!key)return msg.innerHTML='<span class="err">Connect Supabase in Settings first.</span>';
 const previous=supa,previousUser=user,client=createAccountClient(url,key,name);supa=client;watchAccountClient(client,name,url);
 const r=await client.auth.signInWithPassword({email:hiddenEmail(name),password});
 if(r.error){supa=previous;user=previousUser;return msg.innerHTML='<span class="err">Incorrect username or password.</span>'}
 user=r.data.user;rememberAccount(user.user_metadata?.username||name,url);closeModal();account();render();refreshNotificationCount()
}
async function signup(){
 const name=username.value.trim(),password=pw.value,url=localStorage.getItem('podly_url'),key=localStorage.getItem('podly_key');
 if(!name||name.length<3||!password)return msg.innerHTML='<span class="err">Use a username with at least 3 characters and a password.</span>';
 if(isOfficialUsername(name))return msg.innerHTML='<span class="err">This is a reserved Official account. Create it in the Supabase dashboard first.</span>';
 if(!url||!key)return msg.innerHTML='<span class="err">Connect Supabase in Settings first.</span>';
 const previous=supa,previousUser=user,client=createAccountClient(url,key,name);supa=client;watchAccountClient(client,name,url);
 const r=await client.auth.signUp({email:hiddenEmail(name),password,options:{data:{username:name,display_name:name}}});
 if(r.error){supa=previous;user=previousUser;return msg.innerHTML='<span class="err">'+esc(r.error.message)+'</span>'}
 if(r.data.session){user=r.data.user;rememberAccount(user.user_metadata?.username||name,url);closeModal();account();render();refreshNotificationCount()}
 else{supa=previous;user=previousUser;msg.innerHTML='<span class="ok">Account created. Sign in with your username and password.</span>'}
}

async function saveSettings(owner){
 localStorage.setItem('podly_theme',document.getElementById('themeSet').value);localStorage.setItem('podly_anim',document.getElementById('animSet').value);applyInterface();
 const u=document.getElementById('su')?.value.trim()||'',k=document.getElementById('sk')?.value.trim()||'';
 if((u&&!k)||(!u&&k))return appAlert('Enter both the Supabase Project URL and Publishable key.');
 if(owner){const o=document.getElementById('ownerName').value.trim();if(!o)return appAlert('Enter the owner username.');localStorage.setItem('podly_owner_username',o)}
 if(u&&k){
  try{localStorage.setItem('podly_url',u);localStorage.setItem('podly_key',k);const name=usernameOf()||localStorage.getItem(activeAccountKey(u))||'default';supa=createAccountClient(u,k,name);watchAccountClient(supa,name,u);const session=await supa.auth.getSession();if(session.error)throw session.error;user=session.data.session?.user||null;if(user)rememberAccount(user.user_metadata?.username||name,u);await load()}
  catch(e){console.error(e);return appAlert(e.message||'Could not connect to Supabase.','Connection failed')}
 }
 closeModal();account();render();if(user)refreshNotificationCount()
}
function applyInterface(){const theme=localStorage.getItem('podly_theme')||'dark';document.documentElement.setAttribute('data-theme',theme);document.body.classList.toggle('no-anim',localStorage.getItem('podly_anim')==='off')}
function settings(){
 const owner=isOwner(),connected=!!(localStorage.getItem('podly_url')&&localStorage.getItem('podly_key'));
 modal(`<div class="modal"><div class="modalHead"><h2>⚙️ Settings</h2><button class="close" onclick="closeModal()">×</button></div><h3>Interface</h3><div class="field"><label>Theme</label><select id="themeSet"><option value="dark" ${(localStorage.getItem('podly_theme')||'dark')==='dark'?'selected':''}>Dark</option><option value="light" ${localStorage.getItem('podly_theme')==='light'?'selected':''}>Light</option></select></div><div class="field"><label>Animations</label><select id="animSet"><option value="on" ${localStorage.getItem('podly_anim')!=='off'?'selected':''}>On</option><option value="off" ${localStorage.getItem('podly_anim')==='off'?'selected':''}>Off</option></select></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Supabase connection</h3>${connected&&!owner?`<div class="notice">Connected in this browser.</div>`:`<div class="notice">${connected?'Update the Supabase connection for this browser.':'Connect before signing in. These settings are saved in this browser.'}</div><div class="field"><label>Supabase Project URL</label><input id="su" value="${esc(localStorage.getItem('podly_url')||'')}" placeholder="https://your-project.supabase.co"></div><div class="field"><label>Supabase Publishable key</label><input id="sk" value="${esc(localStorage.getItem('podly_key')||'')}" placeholder="sb_publishable_…"></div>`}${owner?`<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Owner</h3><div class="field"><label>Owner username</label><input id="ownerName" value="${esc(localStorage.getItem('podly_owner_username')||'AlbozoB3an')}"></div>`:''}<div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSettings(${owner})">Save</button></div></div>`)
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('dialogRoot')?.childElementCount)closeModal()});
applyInterface();start();
</script>
